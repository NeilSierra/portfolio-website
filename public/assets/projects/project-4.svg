<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="380" fill="#0D0D0D"/>
  <defs>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E1E1E" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#grid4)"/>

  <!-- API telemetry mock -->
  <rect x="40" y="40" width="520" height="300" rx="6" fill="#161616" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="40" y="40" width="520" height="32" rx="6 6 0 0" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <text x="60" y="60" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9A9A9A">GET /api/v1/telemetry // 200 OK</text>

  <!-- Metrics row -->
  <rect x="65" y="90" width="220" height="85" rx="4" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <text x="85" y="125" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#6FA8CC">1,200 req/s</text>
  <text x="85" y="150" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9A9A9A">LOAD BENCHMARK (DOCKER)</text>

  <rect x="315" y="90" width="220" height="85" rx="4" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <text x="335" y="125" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#F9F9F9">14ms</text>
  <text x="335" y="150" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6FA8CC">P95 RESPONSE TIME</text>

  <!-- Route listing -->
  <rect x="65" y="190" width="470" height="125" rx="4" fill="#050505" stroke="#2E2E2E" stroke-width="1"/>
  <text x="85" y="220" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6FA8CC">POST /auth/jwt/token</text>
  <text x="320" y="220" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9A9A9A">Bearer Auth + Rotation</text>
  <text x="85" y="250" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6FA8CC">GET  /resources/students</text>
  <text x="320" y="250" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9A9A9A">Cached Redis Read</text>
  <text x="85" y="280" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6FA8CC">GET  /healthz</text>
  <text x="320" y="280" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9A9A9A">Docker Status: Healthy</text>
</svg>

