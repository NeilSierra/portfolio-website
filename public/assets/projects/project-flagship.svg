<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#0D0D0D"/>
  
  <!-- Subtle Blueprint Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#grid)"/>

  <!-- Window Chrome Header -->
  <rect x="0" y="0" width="800" height="36" fill="#161616" stroke="#2E2E2E" stroke-width="1"/>
  <circle cx="20" cy="18" r="5" fill="#444444"/>
  <circle cx="36" cy="18" r="5" fill="#444444"/>
  <circle cx="52" cy="18" r="5" fill="#444444"/>
  <text x="75" y="22" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#9A9A9A">enterprise-hub.app.v1 // PREVIEW SPECIMEN</text>

  <!-- Card Mockup inside Preview -->
  <rect x="40" y="66" width="720" height="374" rx="6" fill="#161616" stroke="#2E2E2E" stroke-width="1"/>
  
  <!-- Sidebar Mockup -->
  <rect x="40" y="66" width="180" height="374" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="60" y="90" width="140" height="16" rx="2" fill="#225577" opacity="0.6"/>
  <rect x="60" y="120" width="110" height="10" rx="2" fill="#333333"/>
  <rect x="60" y="140" width="130" height="10" rx="2" fill="#333333"/>
  <rect x="60" y="160" width="95" height="10" rx="2" fill="#333333"/>

  <!-- Content Dashboard Mockup -->
  <rect x="250" y="90" width="480" height="70" rx="4" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <text x="270" y="125" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#6FA8CC" font-weight="600">FULL-STACK ENTERPRISE HUB</text>
  <text x="270" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#9A9A9A">PostgreSQL • Next.js • Supabase • REST Endpoints</text>

  <!-- Metric Panels -->
  <rect x="250" y="180" width="150" height="90" rx="4" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <text x="270" y="215" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#F9F9F9">99.8%</text>
  <text x="270" y="240" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6FA8CC">UPTIME BENCHMARK</text>

  <rect x="415" y="180" width="150" height="90" rx="4" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <text x="435" y="215" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#F9F9F9">&lt;100ms</text>
  <text x="435" y="240" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6FA8CC">QUERY LATENCY</text>

  <rect x="580" y="180" width="150" height="90" rx="4" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <text x="600" y="215" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#F9F9F9">5,000+</text>
  <text x="600" y="240" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6FA8CC">RECORDS MANAGED</text>

  <!-- Data table mock -->
  <rect x="250" y="290" width="480" height="130" rx="4" fill="#0D0D0D" stroke="#2E2E2E" stroke-width="1"/>
  <line x1="250" y1="325" x2="730" y2="325" stroke="#2E2E2E" stroke-width="1"/>
  <line x1="250" y1="360" x2="730" y2="360" stroke="#2E2E2E" stroke-width="1"/>
  <line x1="250" y1="395" x2="730" y2="395" stroke="#2E2E2E" stroke-width="1"/>

  <!-- Corner crop brackets -->
  <path d="M 20 50 L 20 30 L 40 30" stroke="#6FA8CC" stroke-width="1.5"/>
  <path d="M 780 50 L 780 30 L 760 30" stroke="#6FA8CC" stroke-width="1.5"/>
  <path d="M 20 430 L 20 450 L 40 450" stroke="#6FA8CC" stroke-width="1.5"/>
  <path d="M 780 430 L 780 450 L 760 450" stroke="#6FA8CC" stroke-width="1.5"/>
</svg>

